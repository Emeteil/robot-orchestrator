[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-orchestrator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "PyYAML>=6.0.3",
    "PyJWT>=2.10",
    "httpx>=0.27",
    "websockets>=13",
    "qrcode[pil]>=7.4",
    "pyzbar>=0.1.9",
    "base45>=0.4.4",
]

[project.optional-dependencies]
hardware = ["opencv-python-headless>=4.10", "sounddevice>=0.5", "numpy>=1.26,<2", "gpiod>=2.1"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
robot-orchestrator = "robot_orchestrator.cli:main"

[tool.setuptools.packages.find]
include = ["robot_orchestrator*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
