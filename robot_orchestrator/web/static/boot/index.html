<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supervisor — запуск</title>
<style>
  /* Base layout targets the robot's own 800x480 display; the "wide" block at the bottom is for big monitors. */
  :root {
    color-scheme: dark;
    --bg: #05080f; --panel: #0a101d; --panel2: #0d1526; --edge: #182240;
    --fg: #d6e1f5; --dim: #6c7b99; --dimmer: #44506b;
    --accent: #4ad8ff; --violet: #8b7bff; --ok: #4ade80; --warn: #fbbf24; --err: #ff5d73;
    --mono: "JetBrains Mono", "Cascadia Mono", "DejaVu Sans Mono", Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }
  * { box-sizing: border-box; }
  html { font-size: 12px; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(800px 380px at 10% -12%, rgba(139, 123, 255, .16), transparent 60%),
      radial-gradient(700px 360px at 100% 0%, rgba(74, 216, 255, .11), transparent 55%),
      var(--bg);
    color: var(--fg); font-family: var(--sans);
    display: flex; flex-direction: column; overflow: hidden; -webkit-user-select: none; user-select: none;
  }
  .grow { flex: 1; }

  header { display: flex; align-items: center; gap: .7rem; padding: .5rem .8rem .35rem; flex: none; }
  .brand { display: flex; align-items: baseline; gap: .7rem; min-width: 0; }
  .brand .logo {
    font-size: 1.3rem; font-weight: 800; letter-spacing: .28em; text-transform: uppercase;
    background: linear-gradient(90deg, var(--accent), var(--violet) 55%, var(--accent));
    background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: sheen 6s linear infinite;
  }
  .brand .sub { display: none; color: var(--dimmer); font: .78rem var(--mono); white-space: nowrap; }
  .badge {
    font: 700 .85rem var(--mono); letter-spacing: .1em; padding: .25rem .65rem; border-radius: 999px;
    border: 1px solid var(--edge); white-space: nowrap; display: inline-flex; align-items: center; gap: .4rem;
  }
  .badge .dot { width: .45rem; height: .45rem; border-radius: 50%; background: currentColor; }
  .badge.booting { color: var(--accent); border-color: rgba(74, 216, 255, .35); background: rgba(74, 216, 255, .07); }
  .badge.booting .dot { animation: pulse 1.2s ease-in-out infinite; }
  .badge.prod { color: var(--ok); border-color: rgba(74, 222, 128, .4); background: rgba(74, 222, 128, .09); }
  .badge.nonprod { color: var(--warn); border-color: rgba(251, 191, 36, .45); background: rgba(251, 191, 36, .09); }
  .clock { font: .95rem var(--mono); color: var(--dim); min-width: 3.2rem; text-align: right; }
  .open-btn {
    display: none; align-items: center; gap: .45rem; min-height: 2.7rem; padding: 0 1rem; border-radius: .6rem;
    font: 700 .95rem var(--sans); color: #06121a; text-decoration: none; cursor: pointer; white-space: nowrap;
    background: linear-gradient(135deg, var(--accent), #7cf0c6); animation: glow 2s ease-out infinite;
  }
  .open-btn.visible { display: inline-flex; }
  .open-btn:active { transform: scale(.97); }

  .progress { margin: 0 .8rem; height: .28rem; border-radius: 999px; background: #0f1a30; position: relative; overflow: hidden; flex: none; }
  .progress .fill {
    height: 100%; width: 0; border-radius: inherit; transition: width .6s cubic-bezier(.2, .8, .2, 1);
    background: linear-gradient(90deg, var(--violet), var(--accent));
  }
  .progress .fill::after {
    content: ""; position: absolute; inset: 0; width: 40%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .45), transparent);
    animation: sweep 1.8s ease-in-out infinite;
  }
  .progress.done .fill::after { display: none; }
  .progress.done .fill { background: linear-gradient(90deg, var(--ok), #86efac); }
  .progress.warn .fill { background: linear-gradient(90deg, var(--warn), #fde68a); }

  /* compact stage rail: one cell per stage, tap a cell to inspect it */
  .rail { display: flex; gap: 3px; padding: .5rem .8rem 0; flex: none; }
  .cell {
    flex: 1; min-width: 0; height: 1.8rem; border-radius: .4rem; border: 1px solid var(--edge); background: var(--panel);
    color: var(--dimmer); display: grid; place-items: center; font: .95rem/1 var(--sans); padding: 0; cursor: pointer;
  }
  .cell.running { border-color: rgba(74, 216, 255, .6); background: rgba(74, 216, 255, .12); }
  .cell.ok { color: var(--ok); border-color: rgba(74, 222, 128, .28); background: rgba(74, 222, 128, .06); }
  .cell.warn { color: var(--warn); border-color: rgba(251, 191, 36, .4); background: rgba(251, 191, 36, .08); }
  .cell.failed { color: var(--err); border-color: rgba(255, 93, 115, .45); background: rgba(255, 93, 115, .09); }
  .cell.skipped { color: var(--dimmer); opacity: .7; }
  .cell.inspected { outline: 1px solid var(--accent); outline-offset: 1px; }
  .spin {
    width: .9rem; height: .9rem; border-radius: 50%; border: 2px solid rgba(74, 216, 255, .22);
    border-top-color: var(--accent); animation: spin .8s linear infinite;
  }

  .now { display: flex; align-items: center; gap: .55rem; flex-wrap: wrap; padding: .4rem .8rem .1rem; min-height: 2.1rem; flex: none; }
  .now .msg { font: 700 1.05rem var(--sans); color: #eaf6ff; min-width: 0; overflow-wrap: anywhere; }
  .now .msg small { font: .9rem var(--mono); color: #8ea4c8; font-weight: 400; margin-left: .3rem; }
  .now .msg.ok { color: var(--ok); }
  .now .msg.warn { color: var(--warn); }
  .now .msg.failed { color: var(--err); }
  .chip {
    font: .85rem var(--mono); color: #fde7a8; border: 1px solid rgba(251, 191, 36, .35); border-radius: 999px;
    padding: .12rem .6rem; background: rgba(251, 191, 36, .08);
  }
  .reasons { display: none; }

  main { flex: 1; min-height: 0; display: flex; padding: .45rem .6rem .6rem; }
  .panel {
    background: linear-gradient(180deg, var(--panel), var(--panel2)); border: 1px solid var(--edge);
    border-radius: .7rem; min-height: 0; display: flex; flex-direction: column; overflow: hidden; position: relative; min-width: 0;
  }
  .log-panel { flex: 1; }
  .steps-panel { display: none; }
  .panel h2 {
    display: none; margin: 0; padding: .65rem .95rem; font: 700 .72rem var(--mono); letter-spacing: .22em; color: var(--dim);
    border-bottom: 1px solid var(--edge); align-items: center; justify-content: space-between;
  }
  .live {
    display: inline-flex; align-items: center; gap: .35rem; white-space: nowrap;
    font: .8rem var(--mono); color: var(--dimmer); letter-spacing: .06em;
  }
  .now-row { display: flex; align-items: center; padding-right: .8rem; flex: none; }
  .now-row .now { flex: 1; min-width: 0; }
  .live i { width: .4rem; height: .4rem; border-radius: 50%; background: var(--ok); animation: pulse 1.2s ease-in-out infinite; }
  .live.off i { background: var(--err); animation: none; }
  .conn-lost { color: var(--err); }

  .steps { list-style: none; margin: 0; padding: .4rem .35rem; overflow-y: auto; flex: 1; min-height: 0; }
  .step {
    display: grid; grid-template-columns: 1.4rem minmax(0, 1fr) auto; gap: .5rem; align-items: start;
    padding: .28rem .5rem; border-radius: .55rem; position: relative;
  }
  .step .ico { width: 1.1rem; height: 1.1rem; margin-top: .08rem; display: grid; place-items: center; font-size: .9rem; line-height: 1; }
  .step .title { font-size: .95rem; font-weight: 600; color: var(--dim); line-height: 1.3; }
  .step .detail {
    font: .78rem/1.3 var(--mono); color: var(--dimmer); margin-top: .05rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .step.running .detail, .step.warn .detail, .step.failed .detail { white-space: normal; overflow: visible; overflow-wrap: anywhere; }
  .step .dur { font: .78rem var(--mono); color: var(--dimmer); padding-top: .12rem; }
  .step.pending .ico { color: var(--dimmer); }
  .step.running { background: linear-gradient(90deg, rgba(74, 216, 255, .10), transparent); }
  .step.running::before {
    content: ""; position: absolute; left: 0; top: .35rem; bottom: .35rem; width: .17rem; border-radius: 2px;
    background: var(--accent); animation: pulse 1.1s ease-in-out infinite;
  }
  .step.running .title { color: #eaf6ff; }
  .step.running .detail { color: #9fb6d6; }
  .step.ok .ico { color: var(--ok); } .step.ok .title { color: var(--fg); }
  .step.warn .ico { color: var(--warn); } .step.warn .title { color: #f5e6b8; } .step.warn .detail { color: #b9a15a; }
  .step.failed .ico { color: var(--err); } .step.failed .title { color: #ffd0d7; } .step.failed .detail { color: #d98a97; }
  .step.skipped .ico, .step.skipped .title { color: var(--dimmer); }

  .qr-card {
    display: none; position: fixed; right: .8rem; bottom: .8rem; width: 15rem; z-index: 30; padding: .6rem;
    border-radius: .7rem; border: 1px solid rgba(163, 230, 53, .4); background: rgba(6, 12, 8, .94);
    box-shadow: 0 10px 30px rgba(0, 0, 0, .6);
  }
  .qr-card.visible { display: block; }
  .qr-frame { position: relative; border-radius: .45rem; overflow: hidden; background: #000; aspect-ratio: 4 / 3; }
  .qr-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .qr-frame::after {
    content: ""; position: absolute; left: 0; right: 0; height: 2px; top: 0;
    background: linear-gradient(90deg, transparent, #a3e635, transparent); box-shadow: 0 0 10px #a3e635;
    animation: scan 2.2s ease-in-out infinite;
  }
  .qr-hint { margin-top: .45rem; font-size: .85rem; color: #cfe7a0; text-align: center; line-height: 1.3; }

  .log {
    flex: 1; min-height: 0; overflow-y: auto; padding: .5rem .7rem .8rem; font: 1rem/1.36 var(--mono);
    scrollbar-width: thin; scrollbar-color: #24345c transparent; overscroll-behavior: contain;
    -webkit-user-select: text; user-select: text;
  }
  .log-fade { position: absolute; left: 0; right: .5rem; top: 0; height: 2.4rem; pointer-events: none; z-index: 2;
    background: linear-gradient(180deg, var(--panel), rgba(10, 16, 29, 0)); }
  .line { display: grid; grid-template-columns: 4.9rem 6.6rem minmax(0, 1fr) auto; gap: .5rem; padding: .03rem 0;
    animation: lineIn .22s ease-out; }
  .line.instant { animation: none; }
  .line .t { color: var(--dimmer); }
  .line .t .ms { display: none; }
  .line .src { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; text-align: right; opacity: .9; }
  .line .txt { color: #b8c6e0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .line .cnt { color: var(--dim); font-size: .8rem; align-self: center; }
  .line.lv-dim .txt { color: var(--dimmer); }
  .line.lv-cmd .txt { color: var(--accent); }
  .line.lv-cmd .txt::before { content: "❯ "; color: var(--violet); }
  .line.lv-ok .txt { color: var(--ok); }
  .line.lv-warn .txt { color: var(--warn); }
  .line.lv-error .txt { color: var(--err); }
  .line.lv-step { margin-top: .4rem; padding-top: .3rem; border-top: 1px solid var(--edge); }
  .line.lv-step .txt { color: #eaf3ff; font-weight: 700; }
  .line.fresh .txt { text-shadow: 0 0 10px rgba(74, 216, 255, .35); }
  .cursor-row { padding-left: 12.5rem; color: var(--accent); }
  .cursor-row span { animation: blink 1s steps(1) infinite; }
  .jump {
    position: absolute; left: 50%; bottom: .7rem; transform: translateX(-50%); z-index: 3; display: none;
    border: 0; border-radius: 999px; padding: .4rem 1rem; font: 700 .9rem var(--sans); color: #06121a;
    background: var(--accent); box-shadow: 0 4px 18px rgba(0, 0, 0, .5); cursor: pointer;
  }
  .jump.visible { display: block; }
  footer { display: none; }


  /* ---------------- settings modal (PIN-protected) ---------------- */
  .gear-btn {
    display: none; width: 2.7rem; height: 2.7rem; border-radius: .6rem; border: 1px solid var(--edge); background: var(--panel2);
    color: var(--fg); font-size: 1.5rem; line-height: 1; cursor: pointer; padding: 0; place-items: center;
  }
  .gear-btn.visible { display: inline-grid; }
  .gear-btn:active { transform: scale(.94); background: var(--edge); }
  .modal { position: fixed; inset: 0; z-index: 100; display: none; flex-direction: column; background: var(--bg); }
  .modal.open { display: flex; }
  .m-head { display: flex; align-items: center; gap: .7rem; padding: .5rem .8rem; border-bottom: 1px solid var(--edge); flex: none; }
  .m-head h1 { margin: 0; font: 800 1.1rem var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--dim); flex: 1; }
  .btn {
    min-height: 2.5rem; padding: 0 .9rem; border-radius: .55rem; border: 1px solid var(--edge); background: var(--panel2); color: var(--fg);
    font: 600 .95rem var(--sans); cursor: pointer; white-space: nowrap;
  }
  .btn:active { transform: scale(.96); }
  .btn:disabled { opacity: .45; }
  .btn.primary { background: linear-gradient(135deg, var(--accent), #7cf0c6); color: #06121a; border: 0; }
  .btn.danger { color: var(--err); border-color: rgba(255, 93, 115, .45); }
  .btn.small { min-height: 2.1rem; padding: 0 .7rem; font-size: .85rem; }
  .m-tabs { display: flex; gap: .35rem; padding: .4rem .8rem; flex: none; overflow-x: auto; }
  .m-tab { flex: 1; min-width: 5.5rem; }
  .m-tab.active { border-color: var(--accent); color: var(--accent); background: rgba(74, 216, 255, .08); }
  .m-body { flex: 1; min-height: 0; overflow-y: auto; padding: .4rem .8rem .8rem; -webkit-user-select: text; user-select: text; }
  .card { background: var(--panel); border: 1px solid var(--edge); border-radius: .7rem; padding: .6rem .8rem; margin-bottom: .6rem; }
  .card h3 { margin: 0 0 .45rem; font: 700 .8rem var(--mono); letter-spacing: .18em; color: var(--dim); text-transform: uppercase; }
  .kv { display: grid; grid-template-columns: 8rem minmax(0, 1fr); gap: .25rem .6rem; font: .95rem var(--mono); }
  .kv span:nth-child(odd) { color: var(--dim); }
  .row { display: flex; align-items: center; gap: .6rem; padding: .3rem 0; border-top: 1px solid var(--edge); min-height: 2.8rem; }
  .card h3 + .row { border-top: 0; }
  .row .grow { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: .95rem var(--mono); flex: 1; }
  .row small { color: var(--dim); font: .8rem var(--mono); margin-left: .4rem; }
  .tag { font: .75rem var(--mono); border: 1px solid var(--edge); border-radius: 999px; padding: .1rem .5rem; color: var(--dim); }
  .tag.ok { color: var(--ok); border-color: rgba(74, 222, 128, .4); }
  .tag.warn { color: var(--warn); border-color: rgba(251, 191, 36, .4); }
  .tag.err { color: var(--err); border-color: rgba(255, 93, 115, .4); }
  .toast { margin: .3rem 0; font: .9rem var(--mono); color: var(--accent); min-height: 1.2rem; }
  .toast.err { color: var(--err); }
  .switch { position: relative; width: 3.4rem; height: 1.9rem; border-radius: 999px; background: #1a2440; border: 1px solid var(--edge); cursor: pointer; flex: none; padding: 0; }
  .switch::after { content: ""; position: absolute; top: .18rem; left: .2rem; width: 1.4rem; height: 1.4rem; border-radius: 50%; background: var(--dim); transition: transform .2s, background .2s; }
  .switch.on { background: rgba(74, 222, 128, .25); border-color: rgba(74, 222, 128, .5); }
  .switch.on::after { transform: translateX(1.5rem); background: var(--ok); }
  .switch:disabled { opacity: .4; }
  input[type=range].vol { width: 100%; height: 2.4rem; accent-color: var(--accent); }
  .vol-row { display: flex; align-items: center; gap: .8rem; }
  .vol-num { font: 700 1.6rem var(--mono); min-width: 4.2rem; text-align: right; }
  .field {
    display: block; width: 100%; min-height: 2.6rem; padding: .4rem .7rem; margin-bottom: .45rem; border-radius: .55rem; border: 1px solid var(--edge);
    background: var(--bg); color: var(--fg); font: 1rem var(--mono); text-align: left; cursor: text; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .field.focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .field.empty { color: var(--dimmer); }
  .logbox { font: .8rem/1.35 var(--mono); color: #b8c6e0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .logbox .e { color: var(--err); } .logbox .w { color: var(--warn); }

  .pin { margin: auto; display: flex; flex-direction: column; align-items: center; gap: .55rem; }
  .pin h2 { margin: 0; font: 700 1.15rem var(--sans); }
  .pin .hint { color: var(--dim); font: .9rem var(--mono); min-height: 1.2rem; text-align: center; }
  .pin .hint.err { color: var(--err); }
  .dots { display: flex; gap: 1rem; margin: .1rem 0; }
  .dots i { width: 1.1rem; height: 1.1rem; border-radius: 50%; border: 2px solid var(--dim); }
  .dots i.on { background: var(--accent); border-color: var(--accent); }
  .dots.shake { animation: shake .35s; }
  .keypad { display: grid; grid-template-columns: repeat(3, 4.6rem); gap: .45rem; }
  .keypad button {
    height: 3.2rem; border-radius: .7rem; border: 1px solid var(--edge); background: var(--panel2); color: var(--fg);
    font: 600 1.5rem var(--mono); cursor: pointer; padding: 0;
  }
  .keypad button:active { background: var(--edge); transform: scale(.95); }
  .keypad .fn { font-size: 1.1rem; color: var(--dim); }
  @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }

  .osk { flex: none; padding: .35rem .5rem .5rem; border-top: 1px solid var(--edge); background: #070c17; display: none; }
  .osk.open { display: block; }
  .osk-row { display: flex; gap: .3rem; margin-bottom: .3rem; justify-content: center; }
  .osk-row button {
    flex: 1; max-width: 4.3rem; height: 2.2rem; border-radius: .5rem; border: 1px solid var(--edge); background: var(--panel2);
    color: var(--fg); font: 600 1.1rem var(--mono); cursor: pointer; padding: 0;
  }
  .osk-row button:active { background: var(--edge); }
  .osk-row .wide { max-width: 6rem; flex: 1.5; font-size: .9rem; }
  .osk-row .space { max-width: none; flex: 5; }
  .osk-row .done { background: linear-gradient(135deg, var(--accent), #7cf0c6); color: #06121a; border: 0; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  @keyframes sweep { 0% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }
  @keyframes sheen { to { background-position: -200% 0; } }
  @keyframes scan { 0%, 100% { top: 0; } 50% { top: calc(100% - 2px); } }
  @keyframes lineIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes glow { 0% { box-shadow: 0 0 0 0 rgba(74, 216, 255, .55); } 70%, 100% { box-shadow: 0 0 0 .7rem rgba(74, 216, 255, 0); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  /* wide monitors: sidebar with the full stage list instead of the compact rail */
  @media (min-width: 1000px) and (min-height: 640px) {
    html { font-size: clamp(13px, .55vw + 7px, 16px); }
    header { padding: .8rem 1.2rem .55rem; gap: 1rem; }
    .brand .sub { display: inline; }
    .brand .logo { font-size: 1.45rem; }
    .progress { margin: 0 1.2rem; }
    .rail, .now-row { display: none; }
    .reasons { display: flex; flex-wrap: wrap; gap: .4rem; padding: 0 1.2rem; }
    .reasons.visible { padding-top: .6rem; }
    main { gap: .8rem; padding: .8rem 1.2rem; }
    .steps-panel { display: flex; flex: 0 0 27%; min-width: 15rem; }
    .panel h2 { display: flex; }
    .log { font-size: .82rem; padding: .7rem .95rem 1.1rem; }
    .log-fade { top: 2.35rem; height: 3rem; }
    .line { grid-template-columns: 5.7rem 8.6rem minmax(0, 1fr) auto; gap: .6rem; }
    .line .t .ms { display: inline; }
    .cursor-row { padding-left: 15.6rem; }
    footer { display: flex; gap: 1rem; align-items: center; padding: .35rem 1.2rem .7rem; font: .72rem var(--mono); color: var(--dimmer); flex: none; }
  }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="logo">Supervisor</span><span class="sub">robot-orchestrator · запуск системы</span></div>
  <div class="grow"></div>
  <span id="badge" class="badge booting"><span class="dot"></span><span id="badge-text">ЗАГРУЗКА</span></span>
  <span id="clock" class="clock">00:00</span>
  <button id="gear-btn" class="gear-btn" type="button" title="Настройки" aria-label="Настройки">⚙</button>
  <a id="open-btn" class="open-btn" href="#">Открыть web-core <span aria-hidden="true">→</span></a>
</header>
<div id="progress" class="progress"><div id="fill" class="fill"></div></div>
<div id="reasons" class="reasons"></div>
<div id="rail" class="rail"></div>
<div class="now-row">
  <div id="now" class="now"></div>
  <span class="live"><i></i><span class="live-text">live</span> · <span class="count">0</span></span>
</div>

<main>
  <section class="panel steps-panel">
    <h2><span>ЭТАПЫ</span><span id="pct">0%</span></h2>
    <ul id="steps" class="steps"></ul>
  </section>

  <section class="panel log-panel">
    <h2><span>ПОТОК СОБЫТИЙ</span><span class="live"><i></i><span class="live-text">live</span> · <span class="count">0</span></span></h2>
    <div class="log-fade"></div>
    <div id="log" class="log"><div id="cursor" class="cursor-row"><span>▍</span></div></div>
    <button id="jump" class="jump" type="button">↓ Новые строки</button>
  </section>
</main>

<div id="settings" class="modal" role="dialog" aria-modal="true" aria-label="Настройки">
  <div class="m-head">

<script>
"use strict";
(function () {
  const $ = (id) => document.getElementById(id);
  const MAX_LINES = 400;

  const SOURCE_COLORS = {
    boot: "#8b7bff", orchestrator: "#8b7bff", git: "#ff9d5c", pip: "#5ab0ff", platformio: "#f5d04a", pio: "#f5d04a",
    openocd: "#f472b6", swd: "#f472b6", mcu: "#fb7185", supervisor: "#2dd4bf", "web-core": "#4ade80",
    "voice-interface": "#c084fc", kiosk: "#94a3b8", wifi: "#22d3ee", qr: "#a3e635", microphone: "#38bdf8",
    camera: "#38bdf8", check: "#fbbf24", "com-link-RT": "#fb923c",
  };
  const FALLBACK_COLORS = ["#5eead4", "#fda4af", "#a5b4fc", "#fcd34d", "#86efac", "#7dd3fc"];
  const REASONS = {
    camera_unavailable: "нет камеры", mic_unavailable: "нет микрофона", internet_down: "нет интернета",
    stlink_missing: "нет ST-Link", mcu_missing: "MCU не отвечает", firmware_unavailable: "прошивка недоступна",
    mcu_flash_failed: "ошибка прошивки MCU", mcu_verify_failed: "MCU не прошёл проверку",
    mcu_client_incompatible: "версия MCU не совпадает", gpio_forced: "перемычка GPIO замкнута",
  };
  const STATUS_ICON = { pending: "○", ok: "✔", warn: "⚠", failed: "✖", skipped: "–" };

  const els = {
    log: $("log"), cursor: $("cursor"), jump: $("jump"),
    lives: document.querySelectorAll(".live"), liveTexts: document.querySelectorAll(".live-text"),
    counts: document.querySelectorAll(".count"),
    steps: $("steps"), rail: $("rail"), now: $("now"), fill: $("fill"), progress: $("progress"), pct: $("pct"),
    badge: $("badge"), badgeText: $("badge-text"), clock: $("clock"), reasons: $("reasons"), openBtn: $("open-btn"),
    qrCard: $("qr-card"), qrImg: $("qr-img"), footLeft: $("foot-left"), footRight: $("foot-right"),
  };

  function colorFor(source) {
    const base = String(source).split(":")[0];
    if (SOURCE_COLORS[base]) return SOURCE_COLORS[base];
    let h = 0;
    for (const ch of base) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    return FALLBACK_COLORS[h % FALLBACK_COLORS.length];
  }
  const SOURCE_ALIASES = { "voice-interface": "voice", supervisor: "super", "com-link-RT": "com-link", microphone: "mic" };
  function shortSource(source) { return SOURCE_ALIASES[source] || source; }
  function pad(n, w = 2) { return String(n).padStart(w, "0"); }
  function fillTime(el, ts) {
    const d = new Date(ts * 1000);
    el.textContent = pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
    const ms = document.createElement("span");
    ms.className = "ms";
    ms.textContent = "." + pad(d.getMilliseconds(), 3);
    el.appendChild(ms);
  }
  function fmtDuration(sec) {
    if (sec < 0.05) return "";
    if (sec < 60) return sec.toFixed(1) + "s";
    return Math.floor(sec / 60) + "m" + pad(Math.floor(sec % 60)) + "s";
  }
  function reasonLabel(r) {
    if (r.startsWith("secrets_missing:")) return "нет секрета " + r.split(":")[1];
    if (r.startsWith("repo_update_failed:")) return "не обновился " + r.split(":")[1];
    return REASONS[r] || r;
  }

  window.reasonLabel = reasonLabel;

  /* ---------------- log waterfall ---------------- */
  const queue = [];
  let lineCount = 0;
  let last = null;
  let pinned = true;
  let streamEpoch = null;

  els.log.addEventListener("scroll", () => {
    pinned = els.log.scrollHeight - els.log.scrollTop - els.log.clientHeight < 40;
    if (pinned) els.jump.classList.remove("visible");
  });
  els.jump.addEventListener("click", () => { pinned = true; stick(); });

  function stick() {
    if (pinned) {
      els.log.scrollTop = els.log.scrollHeight;
      els.jump.classList.remove("visible");
    } else {
      els.jump.classList.add("visible");
    }
  }

  // history replayed by the server on (re)connect is drawn at once, only live lines animate
  function appendLine(ev, instant) {
    lineCount += 1;
    setCount(lineCount);
    const key = ev.source + "|" + ev.level + "|" + String(ev.text).replace(/\d+/g, "#");
    const collapsible = ev.level === "info" || ev.level === "dim" || ev.level === "warn";
    if (collapsible && last && last.key === key) {
      last.count += 1;
      last.cnt.textContent = "×" + last.count;
      last.t.textContent = "";
      fillTime(last.t, ev.ts);
      last.txt.textContent = ev.text;
      return;
    }
    const el = document.createElement("div");
    el.className = "line lv-" + ev.level + (instant ? " instant" : " fresh");
    const t = document.createElement("span"); t.className = "t"; fillTime(t, ev.ts);
    const src = document.createElement("span"); src.className = "src"; src.textContent = shortSource(ev.source);
    src.title = ev.source;
    src.style.color = colorFor(ev.source);
    const txt = document.createElement("span"); txt.className = "txt"; txt.textContent = ev.text;
    const cnt = document.createElement("span"); cnt.className = "cnt";
    el.append(t, src, txt, cnt);
    els.log.insertBefore(el, els.cursor);
    if (!instant) setTimeout(() => el.classList.remove("fresh"), 700);
    last = { key, el, t, txt, cnt, count: 1 };
    while (els.log.children.length > MAX_LINES + 1) els.log.removeChild(els.log.firstChild);
  }

  function drain() {
    if (!queue.length) return;
    const backlog = queue.length;
    const batch = backlog > 400 ? 40 : backlog > 120 ? 12 : backlog > 30 ? 4 : 1;
    for (let i = 0; i < batch && queue.length; i++) appendLine(queue.shift());
    stick();
  }
  setInterval(drain, 38);

  function resetLog() {
    queue.length = 0;
    history.length = 0;
    lineCount = 0;
    last = null;
    setCount(0);
    while (els.log.firstChild !== els.cursor) els.log.removeChild(els.log.firstChild);
  }

  function setCount(n) {
    for (const el of els.counts) el.textContent = String(n);
  }

  function setLive(ok) {
    for (const el of els.lives) el.classList.toggle("off", !ok);
    for (const el of els.liveTexts) el.textContent = ok ? "live" : "нет связи";
    els.footRight.textContent = ok ? "" : "ожидание оркестратора…";
    els.footRight.className = ok ? "" : "conn-lost";
  }

  let replaying = true;
  const history = [];

  function flushHistory() {
    replaying = false;
    for (const ev of history) appendLine(ev, true);
    history.length = 0;
    pinned = true;
    stick();
  }

  function connect() {
    const es = new EventSource("/boot/api/stream");
    es.onopen = () => { setLive(true); replaying = true; };
    es.onerror = () => setLive(false);
    es.addEventListener("live", flushHistory);
    es.onmessage = (message) => {
      let ev;
      try { ev = JSON.parse(message.data); } catch (e) { return; }
      const epoch = String(message.lastEventId || "").split(":")[0];
      if (epoch && epoch !== streamEpoch) {
        if (streamEpoch !== null) { resetLog(); resetSteps(); }
        streamEpoch = epoch;
      }
      (replaying ? history : queue).push(ev);
    };
  }

  /* ---------------- stages: sidebar rows (wide) + compact rail (robot display) ---------------- */
  const stepRows = new Map();
  const railCells = new Map();
  let latestSteps = [];
  let focusedStep = null;
  let inspect = { id: null, until: 0 };

  function resetSteps() {
    stepRows.clear(); railCells.clear();
    els.steps.innerHTML = ""; els.rail.innerHTML = "";
    focusedStep = null;
  }

  function ensureRow(step) {
    let row = stepRows.get(step.id);
    if (row) return row;
    const li = document.createElement("li");
    const ico = document.createElement("span"); ico.className = "ico";
    const body = document.createElement("div");
    const title = document.createElement("div"); title.className = "title";
    const detail = document.createElement("div"); detail.className = "detail";
    body.append(title, detail);
    const dur = document.createElement("span"); dur.className = "dur";
    li.append(ico, body, dur);
    els.steps.appendChild(li);
    row = { li, ico, title, detail, dur, status: null };
    stepRows.set(step.id, row);
    return row;
  }

  function ensureCell(step) {
    let cell = railCells.get(step.id);
    if (cell) return cell;
    const el = document.createElement("button");
    el.type = "button";
    el.addEventListener("click", () => {
      inspect = { id: step.id, until: Date.now() + 6000 };
      renderNow();
    });
    els.rail.appendChild(el);
    cell = { el, status: null };
    railCells.set(step.id, cell);
    return cell;
  }

  function setIcon(host, status) {
    host.innerHTML = "";
    if (status === "running") {
      const s = document.createElement("span"); s.className = "spin"; host.appendChild(s);
    } else {
      host.textContent = STATUS_ICON[status] || "○";
    }
  }

  function renderSteps(steps) {
    latestSteps = steps;
    for (const step of steps) {
      const row = ensureRow(step);
      const cell = ensureCell(step);
      if (row.status !== step.status) {
        row.status = step.status;
        row.li.className = "step " + step.status;
        setIcon(row.ico, step.status);
      }
      if (cell.status !== step.status) {
        cell.status = step.status;
        cell.el.className = "cell " + step.status;
        setIcon(cell.el, step.status);
      }
      cell.el.title = step.title;
      cell.el.classList.toggle("inspected", inspect.id === step.id && Date.now() < inspect.until);
      row.title.textContent = step.title;
      row.detail.textContent = step.detail || "";
      row.detail.title = step.detail || "";
      row.detail.style.display = step.detail ? "" : "none";
    }
    let focus = steps.find((s) => s.status === "running");
    if (!focus) {
      for (const s of steps) if (s.status !== "pending") focus = s;
    }
    if (focus && focus.id !== focusedStep) {
      focusedStep = focus.id;
      const row = stepRows.get(focus.id);
      if (row) row.li.scrollIntoView({ block: "nearest" });
    }
  }

  function tickDurations() {
    const now = Date.now() / 1000;
    for (const step of latestSteps) {
      const row = stepRows.get(step.id);
      if (!row || !step.started_at) continue;
      const end = step.finished_at || (step.status === "running" ? now : step.started_at);
      row.dur.textContent = fmtDuration(end - step.started_at);
    }
  }

  /* ---------------- header / "now" line ---------------- */
  let lastState = null;
  let elapsedBase = { value: 0, at: performance.now(), running: true };
  let finishedSeenAt = null;
  let qrTimer = null;

  function tickClock() {
    const sec = elapsedBase.running ? elapsedBase.value + (performance.now() - elapsedBase.at) / 1000 : elapsedBase.value;
    els.clock.textContent = pad(Math.floor(sec / 60)) + ":" + pad(Math.floor(sec % 60));
    tickDurations();
    if (inspect.id && Date.now() >= inspect.until) { inspect = { id: null, until: 0 }; renderNow(); }
  }
  setInterval(tickClock, 500);

  function setQr(active) {
    els.qrCard.classList.toggle("visible", active);
    if (active && !qrTimer) {
      const refresh = () => {
        const img = new Image();
        img.onload = () => { els.qrImg.src = img.src; };
        img.src = "/boot/api/qr-preview?ts=" + Date.now();
      };
      refresh();
      qrTimer = setInterval(refresh, 450);
    } else if (!active && qrTimer) {
      clearInterval(qrTimer);
      qrTimer = null;
    }
  }

  function renderNow() {
    const state = lastState;
    els.now.innerHTML = "";
    if (!state) return;
    const steps = state.steps || [];
    const msg = document.createElement("span");
    msg.className = "msg";

    const inspected = inspect.id && Date.now() < inspect.until ? steps.find((s) => s.id === inspect.id) : null;
    const running = steps.find((s) => s.status === "running");
    if (inspected) {
      msg.classList.add(inspected.status === "skipped" ? "" : inspected.status);
      msg.textContent = (STATUS_ICON[inspected.status] || "▶") + " " + inspected.title;
      if (inspected.detail) { const d = document.createElement("small"); d.textContent = inspected.detail; msg.appendChild(d); }
      els.now.appendChild(msg);
      return;
    }
    if (state.finished) {
      const production = !!state.production;
      msg.classList.add(production ? "ok" : "warn");
      msg.textContent = production ? "✔ Система готова" : "⚠ NON-PROD:";
      els.now.appendChild(msg);
      if (!production) {
        const reasons = state.reasons || [];
        for (const r of reasons) {
          const chip = document.createElement("span"); chip.className = "chip"; chip.textContent = reasonLabel(r);
          els.now.appendChild(chip);
        }
      }
      return;
    }
    const current = running || [...steps].reverse().find((s) => s.status !== "pending");
    if (current) {
      const spin = document.createElement("span"); spin.className = "spin"; els.now.appendChild(spin);
      msg.textContent = current.title;
      if (current.detail) { const d = document.createElement("small"); d.textContent = current.detail; msg.appendChild(d); }
    } else {
      msg.textContent = "Запуск системы…";
    }
    els.now.appendChild(msg);
  }

  let firstRender = true;

  function render(state) {
    lastState = state;
    window.dispatchEvent(new CustomEvent("boot-state", { detail: state }));
    renderSteps(state.steps || []);
    const percent = state.percent || 0;
    if (firstRender) {
      // do not sweep the bar up from 0% every time the page is opened
      firstRender = false;
      els.fill.style.transition = "none";
      els.fill.style.width = percent + "%";
      void els.fill.offsetWidth;
      els.fill.style.transition = "";
    }
    els.fill.style.width = percent + "%";
    els.pct.textContent = percent + "%";
    elapsedBase = { value: state.elapsed || 0, at: performance.now(), running: !state.finished };

    const qrStep = (state.steps || []).find((s) => s.id === "qr");
    setQr(!!qrStep && qrStep.status === "running");

    const running = state.state === "running";
    const production = !!state.production;
    els.progress.classList.toggle("done", !!state.finished && production);
    els.progress.classList.toggle("warn", !!state.finished && !production);

    if (!running) {
      els.badge.className = "badge booting";
      els.badgeText.textContent = "ЗАГРУЗКА";
    } else if (production) {
      els.badge.className = "badge prod";
      els.badgeText.textContent = state.finished ? "PROD · ГОТОВО" : "PROD";
    } else {
      els.badge.className = "badge nonprod";
      els.badgeText.textContent = "NON-PROD";
    }

    els.reasons.innerHTML = "";
    const reasons = running && !production ? state.reasons || [] : [];
    for (const r of reasons) {
      const chip = document.createElement("span"); chip.className = "chip"; chip.textContent = reasonLabel(r);
      els.reasons.appendChild(chip);
    }
    els.reasons.classList.toggle("visible", reasons.length > 0);

    if (state.finished && finishedSeenAt === null) finishedSeenAt = performance.now();
    const canOpen = running && state.finished && state.operator_url &&
      (!production || performance.now() - finishedSeenAt > 4000);
    if (canOpen) els.openBtn.href = state.operator_url;
    els.openBtn.classList.toggle("visible", !!canOpen);
    els.footLeft.textContent = state.finished ? "загрузка завершена" : "идёт запуск системы";
    renderNow();
  }

  let failures = 0;
  async function pollState() {
    let delay = 700;
    try {
      const response = await fetch("/boot/api/state", { cache: "no-store" });
      if (!response.ok) throw new Error(String(response.status));
      const state = await response.json();
      failures = 0;
      render(state);
      if (state.finished) delay = 2000;
    } catch (e) {
      failures += 1;
      if (failures >= 3) setLive(false);
    }
    setTimeout(pollState, delay);
  }

  connect();
  pollState();
})();
</script>
<script>
"use strict";
(function () {
  const $ = (id) => document.getElementById(id);
  const gear = $("gear-btn"), modal = $("settings"), pinBox = $("m-pin"), mainBox = $("m-main");
  const tabsEl = $("m-tabs"), content = $("m-content"), oskEl = $("osk");
  const IDLE_MS = 120000;

  function h(tag, props, ...children) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v);
    }
    for (const c of children.flat()) if (c != null) el.append(c);
    return el;
  }

  /* ---------------- session / api ---------------- */
  let token = null, tokenAt = 0, sessionPin = null;
  async function pinCall(path, body) {
    const r = await fetch(path, { method: body === undefined ? "GET" : "POST", cache: "no-store",
      headers: { "Content-Type": "application/json" }, body: body === undefined ? undefined : JSON.stringify(body) });
    let data = {};
    try { data = await r.json(); } catch (e) { /* empty body */ }
    return { status: r.status, data };
  }
  async function ensureToken(force) {
    if (!force && token && Date.now() - tokenAt < 8 * 60 * 1000) return token;
    const r = await pinCall("/boot/api/session", { pin: sessionPin });
    if (r.status !== 200) throw new Error("нет доступа к настройкам (" + r.status + ")");
    token = r.data.access_token;
    tokenAt = Date.now();
    return token;
  }
  async function api(path, method, body) {
    for (let attempt = 0; attempt < 2; attempt++) {
      const t = await ensureToken(attempt > 0);
      const headers = { Authorization: "Bearer " + t };
      if (body !== undefined) headers["Content-Type"] = "application/json";
      const r = await fetch(path, { method: method || "GET", headers, body: body === undefined ? undefined : JSON.stringify(body) });
      if (r.status === 401 && attempt === 0) continue;
      if (!r.ok) {
        let detail = "";
        try { detail = (await r.json()).detail; } catch (e) { /* not json */ }
        throw new Error(typeof detail === "string" && detail ? detail : "HTTP " + r.status);
      }
      return r.json();
    }
  }

  /* ---------------- open / close / idle lock ---------------- */
  let unlocked = false, idleTimer = null, ready = false, tabTimer = null;

  window.addEventListener("boot-state", (e) => {
    ready = e.detail.state === "running" && !!e.detail.finished;
    gear.classList.toggle("visible", ready);
  });

  function bumpIdle() {
    clearTimeout(idleTimer);
    if (modal.classList.contains("open")) idleTimer = setTimeout(closeModal, IDLE_MS);
  }
  modal.addEventListener("pointerdown", bumpIdle);

  function openModal() {
    modal.classList.add("open");
    bumpIdle();
    if (unlocked) showMain(); else startPinEntry();
  }
  function closeModal() {
    modal.classList.remove("open");
    unlocked = false;
    clearTimeout(idleTimer);
    clearInterval(tabTimer);
    osk.hide();
    content.innerHTML = "";
    token = null;
    sessionPin = null;
  }
  gear.addEventListener("click", openModal);
  $("m-close").addEventListener("click", closeModal);
  $("m-lock").addEventListener("click", closeModal);

  /* ---------------- PIN pad ---------------- */
  let pinMode = "enter", pinBuf = "", pinFirst = "", lockedUntil = 0, lockTimer = null, changing = false;
  const dots = $("pin-dots").children, hint = $("pin-hint"), title = $("pin-title");

  function setHint(text, err) { hint.textContent = text || ""; hint.classList.toggle("err", !!err); }
  function renderDots() { for (let i = 0; i < dots.length; i++) dots[i].classList.toggle("on", i < pinBuf.length); }
  function shake() {
    const box = $("pin-dots");
    box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake");
  }

  function buildKeypad() {
    const pad = $("keypad");
    pad.innerHTML = "";
    const key = (label, fn, cls) => h("button", { type: "button", class: cls || "", text: label, onclick: fn });
    for (const d of "123456789") pad.append(key(d, () => digit(d)));
    pad.append(changing ? key("Отмена", () => { changing = false; showMain(); }, "fn") : h("span"));
    pad.append(key("0", () => digit("0")));
    pad.append(key("⌫", backspace, "fn"));
  }

  async function startPinEntry() {
    changing = false;
    pinBox.style.display = "flex"; mainBox.style.display = "none";
    $("m-lock").style.display = "none";
    pinBuf = ""; pinFirst = "";
    pinMode = "enter";
    paintPinMode();
    setHint("Проверяю…");
    const r = await pinCall("/boot/api/pin");
    if (r.status !== 200) { setHint("Настройки недоступны (" + r.status + ")", true); return; }
    pinMode = r.data.set ? "enter" : "setup1";
    if (r.data.locked_for > 0) lockedUntil = Date.now() + r.data.locked_for * 1000;
    paintPinMode();
  }

  function startPinChange() {
    changing = true;
    pinBox.style.display = "flex"; mainBox.style.display = "none";
    pinBuf = ""; pinFirst = ""; pinMode = "setup1";
    paintPinMode();
  }

  function paintPinMode() {
    title.textContent = pinMode === "enter" ? "Введите PIN" : pinMode === "setup1" ? "Задайте новый PIN" : "Повторите PIN";
    setHint(pinMode === "setup1" && !changing ? "PIN ещё не задан — придумайте 4 цифры" : "");
    buildKeypad();
    renderDots();
    refreshLockout();
  }

  function refreshLockout() {
    clearInterval(lockTimer);
    const tick = () => {
      const left = Math.ceil((lockedUntil - Date.now()) / 1000);
      const pad = $("keypad");
      for (const b of pad.querySelectorAll("button")) b.disabled = left > 0;
      if (left > 0) setHint("Слишком много попыток. Подождите " + left + " с", true);
      else { clearInterval(lockTimer); if (hint.classList.contains("err") && pinMode === "enter") setHint(""); }
    };
    if (lockedUntil > Date.now()) { tick(); lockTimer = setInterval(tick, 500); }
  }

  function digit(d) {
    if (lockedUntil > Date.now() || pinBuf.length >= 4) return;
    pinBuf += d;
    renderDots();
    if (pinBuf.length === 4) setTimeout(submitPin, 90);
  }
  function backspace() { pinBuf = pinBuf.slice(0, -1); renderDots(); }

  async function submitPin() {
    const entered = pinBuf;
    pinBuf = ""; renderDots();
    if (pinMode === "enter") {
      const r = await pinCall("/boot/api/session", { pin: entered });
      if (r.status === 200) { sessionPin = entered; token = r.data.access_token; tokenAt = Date.now(); unlocked = true; showMain(); return; }
      shake();
      if (r.status === 429) { lockedUntil = Date.now() + ((r.data.detail && r.data.detail.retry_after) || 30) * 1000; refreshLockout(); }
      else if (r.status === 401) setHint("Неверный PIN. Осталось попыток: " + (r.data.detail && r.data.detail.attempts_left), true);
      else setHint("Ошибка " + r.status, true);
    } else if (pinMode === "setup1") {
      pinFirst = entered; pinMode = "setup2"; paintPinMode();
    } else {
      if (entered !== pinFirst) { shake(); pinMode = "setup1"; paintPinMode(); setHint("PIN не совпал — введите заново", true); return; }
      const r = changing
        ? await pinCall("/boot/api/pin/change", { current: sessionPin, new: entered })
        : await pinCall("/boot/api/pin/setup", { pin: entered });
      if (r.status !== 200) { setHint("Не удалось сохранить PIN (" + r.status + ")", true); return; }
      sessionPin = entered; token = r.data.access_token || null; tokenAt = Date.now();
      unlocked = true; changing = false; showMain();
    }
  }

  document.addEventListener("keydown", (e) => {
    if (!modal.classList.contains("open")) return;
    bumpIdle();
    if (pinBox.style.display !== "none") {
      if (/^[0-9]$/.test(e.key)) digit(e.key);
      else if (e.key === "Backspace") backspace();
      else return;
      e.preventDefault();
      return;
    }
    if (osk.target) {
      if (e.key === "Enter") osk.hide();
      else if (e.key === "Backspace") osk.press("back");
      else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) osk.insert(e.key);
      else return;
      e.preventDefault();
    }
  });

  /* ---------------- on-screen keyboard ---------------- */
  const LAYERS = {
    lower: ["1234567890", "qwertyuiop", "asdfghjkl", "^zxcvbnm<", "?,_ .!"],
    upper: ["1234567890", "QWERTYUIOP", "ASDFGHJKL", "^ZXCVBNM<", "?,_ .!"],
    sym: ["1234567890", "-_=+@#$%&*", "()/:;!?\"'<", "?,_ .!"],
  };
  const osk = {
    target: null, layer: "lower",
    attach(field) {
      if (this.target) this.target.el.classList.remove("focus");
      this.target = field;
      field.el.classList.add("focus");
      oskEl.classList.add("open");
      this.layer = "lower";
      this.draw();
      field.el.scrollIntoView({ block: "center" });
    },
    hide() {
      if (this.target) this.target.el.classList.remove("focus");
      this.target = null;
      oskEl.classList.remove("open");
    },
    insert(ch) { if (this.target) { this.target.value += ch; this.target.render(); } },
    press(code) {
      if (!this.target) return;
      if (code === "back") { this.target.value = this.target.value.slice(0, -1); this.target.render(); }
    },
    draw() {
      oskEl.innerHTML = "";
      const rows = LAYERS[this.layer];
      const mk = (label, cls, fn) => h("button", { type: "button", class: cls || "", text: label, onclick: fn });
      for (let r = 0; r < rows.length - 1; r++) {
        const row = h("div", { class: "osk-row" });
        for (const ch of rows[r]) {
          if (ch === "^") row.append(mk(this.layer === "sym" ? "abc" : "⇧", "wide", () => { this.layer = this.layer === "lower" ? "upper" : "lower"; this.draw(); }));
          else if (ch === "<") row.append(mk("⌫", "wide", () => this.press("back")));
          else row.append(mk(ch, "", () => { this.insert(ch); if (this.layer === "upper") { this.layer = "lower"; this.draw(); } }));
        }
        oskEl.append(row);
      }
      const last = h("div", { class: "osk-row" });
      last.append(mk(this.layer === "sym" ? "abc" : "123", "wide", () => { this.layer = this.layer === "sym" ? "lower" : "sym"; this.draw(); }));
      last.append(mk(",", "", () => this.insert(",")));
      last.append(mk("пробел", "space", () => this.insert(" ")));
      last.append(mk(".", "", () => this.insert(".")));
      last.append(mk("Готово", "wide done", () => this.hide()));
      oskEl.append(last);
    },
  };

  function makeField(placeholder, secret) {
    const field = { value: "", secret: !!secret, reveal: false, el: h("div", { class: "field empty", role: "textbox", tabindex: "0" }) };
    field.render = () => {
      const shown = field.secret && !field.reveal ? "•".repeat(field.value.length) : field.value;
      field.el.textContent = shown || placeholder;
      field.el.classList.toggle("empty", !field.value);
    };
    field.el.addEventListener("click", () => osk.attach(field));
    field.render();
    return field;
  }

  /* ---------------- ui helpers ---------------- */
  let toastEl = null;
  function say(text, err) { if (toastEl) { toastEl.textContent = text || ""; toastEl.classList.toggle("err", !!err); } }
  function card(titleText, ...children) { return h("div", { class: "card" }, h("h3", { text: titleText }), children); }
  function tag(text, kind) { return h("span", { class: "tag " + (kind || ""), text }); }
  function button(label, cls, action) {
    const b = h("button", { type: "button", class: "btn small " + (cls || ""), text: label });
    b.addEventListener("click", async () => {
      b.disabled = true;
      try { await action(b); } catch (e) { say(e.message, true); }
      b.disabled = false;
    });
    return b;
  }
  // a destructive action needs a second tap within three seconds
  function confirmButton(label, cls, action) {
    let armed = null;
    const b = h("button", { type: "button", class: "btn small " + (cls || ""), text: label });
    b.addEventListener("click", async () => {
      if (!armed) {
        b.textContent = "Нажмите ещё раз";
        armed = setTimeout(() => { armed = null; b.textContent = label; }, 3000);
        return;
      }
      clearTimeout(armed); armed = null; b.textContent = label; b.disabled = true;
      try { await action(); } catch (e) { say(e.message, true); }
      b.disabled = false;
    });
    return b;
  }
  function toggle(on, onChange) {
    const sw = h("button", { type: "button", class: "switch" + (on ? " on" : ""), role: "switch" });
    sw.addEventListener("click", async () => {
      const next = !sw.classList.contains("on");
      sw.disabled = true;
      try { const actual = await onChange(next); sw.classList.toggle("on", actual === undefined ? next : !!actual); }
      catch (e) { say(e.message, true); }
      sw.disabled = false;
    });
    return sw;
  }
  const shortSha = (sha) => (sha ? String(sha).slice(0, 7) : "—");
  const stateKind = (s) => (s === "ready" ? "ok" : s === "failed" ? "err" : s === "stopped" || s === "skipped" ? "" : "warn");

  /* ---------------- tabs ---------------- */
  async function tabSystem(box) {
    const [state, services, secrets] = await Promise.all([
      api("/api/state"), api("/api/services"), api("/api/secrets").catch(() => null),
    ]);
    const label = window.reasonLabel || ((r) => r);
    const mode = card("Режим",
      h("div", { class: "row" }, tag(state.production ? "PROD" : "NON-PROD", state.production ? "ok" : "warn"),
        h("span", { class: "grow", text: (state.reasons || []).map(label).join(", ") || "все условия выполнены" })));
    const list = card("Сервисы");
    for (const s of services) {
      list.append(h("div", { class: "row" },
        h("span", { class: "grow", text: s.name }), tag(s.state, stateKind(s.state)),
        button("↻", "", async () => { say("Перезапуск " + s.name + "…"); await api("/api/services/" + s.name + "/restart", "POST"); say(s.name + " перезапущен"); await refreshTab(); }),
        s.state === "stopped" || s.state === "failed" || s.state === "skipped"
          ? button("▶", "", async () => { await api("/api/services/" + s.name + "/start", "POST"); await refreshTab(); })
          : button("■", "danger", async () => { await api("/api/services/" + s.name + "/stop", "POST"); await refreshTab(); })));
    }
    const sec = card("Секреты");
    if (secrets) {
      for (const item of [...secrets.required, ...secrets.optional]) {
        sec.append(h("div", { class: "row" }, h("span", { class: "grow", text: item.key }), tag(item.present ? "есть" : "нет", item.present ? "ok" : "warn")));
      }
      sec.append(h("div", { class: "row" }, h("span", { class: "grow", text: "Считать QR-коды камерой" }),
        button("Сканировать", "", async () => { say("Покажите камере лист с QR-кодами…"); const r = await api("/api/secrets/rescan", "POST"); say(r.scanned ? "Секреты обновлены" : "QR не получен"); })));
    }
    const actions = card("Управление",
      h("div", { class: "row" }, h("span", { class: "grow", text: "PIN-код настроек" }), button("Сменить PIN", "", async () => startPinChange())),
      h("div", { class: "row" }, h("span", { class: "grow", text: "Перезапустить оркестратор" }),
        confirmButton("Перезапуск", "danger", async () => { await api("/api/system/restart", "POST"); say("Оркестратор перезапускается…"); })));
    box.append(mode, list, sec, actions);
  }

  const bars = (p) => (p >= 75 ? "▂▄▆█" : p >= 50 ? "▂▄▆" : p >= 25 ? "▂▄" : "▂");

  async function tabNetwork(box) {
    const info = await api("/api/network");
    const kv = h("div", { class: "kv" });
    const add = (k, v) => kv.append(h("span", { text: k }), h("span", { text: v || "—" }));
    add("IP-адрес", info.ip);
    add("Интерфейс", info.interface ? info.interface + (info.kind === "wifi" ? " (Wi-Fi)" : info.kind === "ethernet" ? " (кабель)" : "") : null);
    if (info.kind === "wifi") add("Сеть", info.ssid);
    add("Шлюз", info.gateway);
    const others = (info.addresses || []).filter((a) => a.interface !== info.interface);
    for (const a of others) add(a.interface, a.ip);
    box.append(card("Сеть и доступ в интернет", h("div", { class: "row" }, tag(info.online ? "маршрут в WAN есть" : "нет маршрута в WAN", info.online ? "ok" : "err")), kv));

    const wifiCard = card("Wi-Fi");
    const formHost = h("div");
    box.append(wifiCard);
    const list = h("div");

    function showForm(ssid, hidden) {
      formHost.innerHTML = "";
      const ssidField = makeField("Имя сети (SSID)", false);
      ssidField.value = ssid || ""; ssidField.render();
      const pwd = makeField("Пароль", true);
      const eye = button("👁", "", async () => { pwd.reveal = !pwd.reveal; pwd.render(); });
      formHost.append(h("div", { class: "card" },
        h("h3", { text: ssid && !hidden ? "Подключение к " + ssid : "Добавить сеть" }),
        ssidField.el, h("div", { class: "row" }, h("div", { style: "flex:1;min-width:0" }, pwd.el), eye),
        h("div", { class: "row" },
          button("Подключиться", "primary", async () => {
            if (!ssidField.value) { say("Укажите имя сети", true); return; }
            osk.hide(); say("Подключаюсь к " + ssidField.value + "…");
            const r = await api("/api/wifi/join", "POST", { ssid: ssidField.value, psk: pwd.value || null });
            say(r.connected ? "Подключено к " + r.ssid : "Не удалось подключиться к " + r.ssid, !r.connected);
            if (r.connected) { formHost.innerHTML = ""; setTimeout(refreshTab, 2500); }
          }),
          button("Отмена", "", async () => { osk.hide(); formHost.innerHTML = ""; }))));
      if (!ssid || hidden) osk.attach(ssidField); else osk.attach(pwd);
    }

    async function loadList(rescan) {
      list.innerHTML = "";
      list.append(h("div", { class: "row" }, h("span", { class: "grow", text: "Поиск сетей…" })));
      let data;
      try { data = await api("/api/wifi/networks" + (rescan ? "?rescan=true" : "")); }
      catch (e) { list.innerHTML = ""; list.append(h("div", { class: "row" }, h("span", { class: "grow", text: e.message }))); return; }
      list.innerHTML = "";
      if (!data.networks.length) list.append(h("div", { class: "row" }, h("span", { class: "grow", text: "Сети не найдены" })));
      for (const n of data.networks) {
        list.append(h("div", { class: "row" },
          h("span", { class: "grow" }, n.ssid, h("small", { text: bars(n.signal) + " " + n.signal + "%" + (n.secured ? " 🔒" : "") })),
          n.in_use ? tag("подключено", "ok") : n.saved ? tag("сохранена") : null,
          n.in_use ? null : button("Подключить", "", async () => {
            if (n.secured && !n.saved) { showForm(n.ssid, false); return; }
            say("Подключаюсь к " + n.ssid + "…");
            const r = await api("/api/wifi/join", "POST", { ssid: n.ssid });
            say(r.connected ? "Подключено к " + n.ssid : "Не удалось подключиться к " + n.ssid, !r.connected);
            if (r.connected) setTimeout(refreshTab, 2500);
          })));
      }
    }
    wifiCard.append(
      h("div", { class: "row" }, button("↻ Обновить", "", async () => loadList(true)), button("＋ Добавить сеть", "", async () => showForm("", true))),
      formHost, list);
    box.append(h("div", { class: "toast", id: "toast" }));
    loadList(false);
  }

  async function tabAudio(box) {
    const volCard = card("Громкость динамиков");
    try {
      const vol = await api("/api/audio/volume");
      const num = h("span", { class: "vol-num", text: vol.percent + "%" });
      const slider = h("input", { type: "range", class: "vol", min: "0", max: "100", step: "1", value: String(vol.percent) });
      let timer = null;
      slider.addEventListener("input", () => {
        num.textContent = slider.value + "%";
        clearTimeout(timer);
        timer = setTimeout(() => api("/api/audio/volume", "POST", { percent: Number(slider.value) }).catch((e) => say(e.message, true)), 150);
      });
      volCard.append(h("div", { class: "vol-row" }, slider, num),
        h("div", { class: "row" }, h("span", { class: "grow", text: "Без звука" }),
          toggle(vol.muted, async (next) => (await api("/api/audio/volume", "POST", { muted: next })).muted)));
    } catch (e) {
      volCard.append(h("div", { class: "row" }, h("span", { class: "grow", text: "Регулятор недоступен: " + e.message })));
    }
    const wakeCard = card("Голосовой ассистент");
    try {
      const wake = await api("/api/voice/wake-word");
      const sw = toggle(wake.enabled === true, async (next) => {
        const r = await api("/api/voice/wake-word", "POST", { enabled: next });
        return r.enabled;
      });
      sw.disabled = !wake.connected || typeof wake.enabled !== "boolean";
      wakeCard.append(h("div", { class: "row" },
        h("span", { class: "grow", text: "Wake word (слово активации)" }),
        wake.connected ? null : tag("voice-interface не подключён", "warn"), sw));
    } catch (e) {
      wakeCard.append(h("div", { class: "row" }, h("span", { class: "grow", text: "Недоступно: " + e.message })));
    }
    box.append(volCard, wakeCard, h("div", { class: "toast", id: "toast" }));
  }

  async function tabUpdates(box) {
    const repos = await api("/api/repos");
    const repoCard = card("Репозитории");
    for (const r of repos) {
      repoCard.append(h("div", { class: "row" },
        h("span", { class: "grow" }, r.name, h("small", { text: shortSha(r.current_sha) + (r.bad_sha ? " ⚠ плохой " + shortSha(r.bad_sha) : "") })),
        button("Проверить", "", async () => {
          const c = await api("/api/repos/" + r.name + "/check", "POST");
          say(c.error ? c.error : c.pending ? r.name + ": есть обновление " + shortSha(c.remote_sha) : r.name + ": актуально", !!c.error);
        }),
        confirmButton("Применить", "", async () => {
          const a = await api("/api/repos/" + r.name + "/apply", "POST");
          say(a.error ? a.error : a.changed ? "Обновлено до " + shortSha(a.sha) + (a.restart_requested ? ", перезапуск…" : "") : "Уже актуально", !!a.error);
        }),
        confirmButton("Откат", "danger", async () => {
          const b = await api("/api/repos/" + r.name + "/rollback", "POST");
          say(b.rolled_back ? "Откат выполнен, перезапуск…" : "Откатываться некуда", !b.rolled_back);
        })));
    }
    box.append(repoCard);

    try {
      const su = await api("/api/self-update");
      const status = h("span", { class: "grow", text: "Оркестратор " + shortSha(su.current_sha) + (su.staged_sha ? " → готово " + shortSha(su.staged_sha) : "") });
      box.append(card("Сам оркестратор", h("div", { class: "row" }, status,
        button("Проверить", "", async () => {
          say("Проверяю обновление…");
          const r = await api("/api/self-update/check", "POST");
          say(r.error ? r.error : r.staged_sha ? "Готово к установке " + shortSha(r.staged_sha) : "Обновлений нет", !!r.error);
          await refreshTab();
        }),
        su.staged_sha ? confirmButton("Установить", "primary", async () => { await api("/api/self-update/apply", "POST"); say("Перезапуск…"); }) : null)));
    } catch (e) { /* self-update is optional */ }

    try {
      const fw = await api("/api/firmware");
      const fwCard = card("Прошивка MCU");
      for (const t of fw) {
        fwCard.append(h("div", { class: "row" },
          h("span", { class: "grow" }, t.name, h("small", { text: shortSha(t.flashed_sha) })),
          t.dirty ? tag("грязная", "err") : t.verified ? tag("проверена", "ok") : tag("не проверена", "warn"),
          button("Проверить", "", async () => { say("Проверяю MCU…"); const r = await api("/api/firmware/" + t.name + "/reverify", "POST"); say(t.name + ": " + r.state + (r.reason ? " — " + r.reason : ""), r.state !== "done" && r.state !== "ok"); await refreshTab(); }),
          confirmButton("Перепрошить", "danger", async () => { say("Прошиваю MCU, подождите…"); const r = await api("/api/firmware/" + t.name + "/reflash", "POST"); say(t.name + ": " + r.state + (r.reason ? " — " + r.reason : ""), r.state !== "done" && r.state !== "ok"); await refreshTab(); })));
      }
      if (fw.length) box.append(fwCard);
    } catch (e) { /* no firmware targets */ }
    box.append(h("div", { class: "toast", id: "toast" }));
  }

  async function tabLogs(box) {
    const pre = h("div", { class: "logbox" });
    box.append(pre);
    const draw = async () => {
      const data = await api("/api/logs/all?lines=150");
      const stick = content.scrollHeight - content.scrollTop - content.clientHeight < 40;
      pre.textContent = "";
      for (const l of data.lines) {
        const d = new Date(l.ts * 1000);
        const line = h("div", { class: l.level === "error" ? "e" : l.level === "warn" ? "w" : "",
          text: d.toTimeString().slice(0, 8) + " " + l.source + "  " + l.text });
        pre.append(line);
      }
      if (stick) content.scrollTop = content.scrollHeight;
    };
    await draw();
    content.scrollTop = content.scrollHeight;
    tabTimer = setInterval(() => draw().catch(() => {}), 3000);
  }

  const TABS = [
    { id: "system", title: "Система", render: tabSystem },
    { id: "net", title: "Сеть", render: tabNetwork },
    { id: "audio", title: "Звук и голос", render: tabAudio },
    { id: "updates", title: "Обновления", render: tabUpdates },
    { id: "logs", title: "Логи", render: tabLogs },
  ];
  let currentTab = TABS[0].id;

  async function refreshTab() {
    clearInterval(tabTimer);
    const tab = TABS.find((t) => t.id === currentTab);
    const box = document.createDocumentFragment();
    const keepScroll = content.scrollTop;
    try {
      await tab.render(box);
    } catch (e) {
      box.append(h("div", { class: "card" }, h("div", { class: "toast err", text: "Ошибка: " + e.message })));
    }
    if (!unlocked) return;
    const toastText = toastEl ? toastEl.textContent : "";
    content.innerHTML = "";
    content.append(box);
    toastEl = content.querySelector("#toast");
    if (!toastEl) { toastEl = h("div", { class: "toast" }); content.prepend(toastEl); }
    toastEl.textContent = toastText;
    if (tab.id !== "logs") content.scrollTop = keepScroll;
  }

  function showMain() {
    pinBox.style.display = "none"; mainBox.style.display = "flex";
    $("m-lock").style.display = "";
    osk.hide();
    tabsEl.innerHTML = "";
    for (const t of TABS) {
      const b = h("button", { type: "button", class: "btn m-tab" + (t.id === currentTab ? " active" : ""), text: t.title });
      b.addEventListener("click", () => {
        currentTab = t.id; osk.hide(); toastEl = null;
        for (const x of tabsEl.children) x.classList.toggle("active", x === b);
        content.innerHTML = ""; refreshTab();
      });
      tabsEl.append(b);
    }
    toastEl = null;
    content.innerHTML = "";
    refreshTab();
  }
})();
</script>
</body>
</html>
