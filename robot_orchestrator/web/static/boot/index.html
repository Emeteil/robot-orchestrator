<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>robot-orchestrator — boot</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0b0f14; color: #e6edf3; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .card { width: min(720px, 92vw); padding: 32px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 24px; color: #8b949e; }
  .banner {
    border-radius: 12px; padding: 20px 24px; margin-bottom: 20px; font-size: 22px; font-weight: 700;
  }
  .banner.prod { background: #103a1f; color: #6bd97a; border: 1px solid #1e5e33; }
  .banner.nonprod { background: #3a2f10; color: #f2c94c; border: 1px solid #5e4d1e; }
  .banner.booting { background: #12202f; color: #7fb3e0; border: 1px solid #1e3a5e; }
  .reasons { list-style: none; margin: 12px 0 0; padding: 0; font-size: 14px; font-weight: 400; color: #c9d1d9; }
  .reasons li { padding: 2px 0; }
  .reasons li::before { content: "— "; opacity: .6; }
  .qr-wrap { margin-top: 20px; text-align: center; }
  .qr-wrap img { max-width: 260px; border-radius: 8px; border: 1px solid #30363d; display: none; }
  .hint { color: #6e7681; font-size: 13px; margin-top: 6px; }
  .footer { margin-top: 24px; font-size: 12px; color: #4a5158; text-align: center; }
</style>
</head>
<body>
<div class="card">
  <h1>robot-orchestrator</h1>
  <div id="banner" class="banner booting">Загрузка…</div>
  <div class="qr-wrap">
    <img id="qr-preview" alt="QR preview">
    <div id="qr-hint" class="hint" style="display:none;">Покажите камере робота лист с QR-кодами секретов</div>
  </div>
  <div class="footer">обновляется автоматически</div>
</div>
<script>
async function poll() {
  try {
    const res = await fetch("/boot/api/state", { cache: "no-store" });
    const data = await res.json();
    render(data);
  } catch (e) {
    render({ state: "booting" });
  }
}

function render(data) {
  const banner = document.getElementById("banner");
  const qr = document.getElementById("qr-preview");
  const qrHint = document.getElementById("qr-hint");
  banner.innerHTML = "";

  if (data.state === "booting" || data.state === "unknown") {
    banner.className = "banner booting";
    banner.textContent = "Загрузка…";
  } else if (data.production) {
    banner.className = "banner prod";
    banner.textContent = "PROD";
  } else {
    banner.className = "banner nonprod";
    banner.textContent = "NON-PROD";
    if (data.reasons && data.reasons.length) {
      const ul = document.createElement("ul");
      ul.className = "reasons";
      for (const reason of data.reasons) {
        const li = document.createElement("li");
        li.textContent = reason;
        ul.appendChild(li);
      }
      banner.appendChild(ul);
    }
  }

  const showQr = data.reasons && data.reasons.some((r) => r.startsWith("secrets_missing"));
  qrHint.style.display = showQr ? "block" : "none";
  if (showQr) {
    qr.style.display = "block";
    qr.src = "/boot/api/qr-preview?ts=" + Date.now();
  } else {
    qr.style.display = "none";
  }
}

poll();
setInterval(poll, 1000);
</script>
</body>
</html>
